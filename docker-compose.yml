# =============================================================================
# CyberCore Docker Compose (Build Only)
# =============================================================================
# 使用方法:
#   Linuxビルド:     docker compose run --rm build-linux
#   成果物取り出し:   docker compose run --rm artifacts
#
# 開発はホストOSで直接実行:
#   npm run dev
# =============================================================================

services:
  build-linux:
    build:
      context: .
      target: build-linux
    volumes:
      - ./dist:/app/dist-output
    command: >
      sh -c "cp -r /app/dist/* /app/dist-output/ 2>/dev/null || echo 'Build artifacts copied'"

  artifacts:
    build:
      context: .
      target: artifacts
    volumes:
      - ./dist:/output
    command: >
      sh -c "cp -r /artifacts/dist/* /output/ 2>/dev/null && ls -la /output || echo 'No artifacts found'"
